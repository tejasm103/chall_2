# Netlify Configuration for MindVerse Static Frontend

[build]
  publish = "frontend"

[[redirects]]
  # Optional API proxy rule if hosting backend on Render
  from = "/api/*"
  to = "https://mindverse-api.onrender.com/api/:splat"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
