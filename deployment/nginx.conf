# MindVerse — Production Nginx Configuration
# Serves static frontend and proxies /api requests to Gunicorn backend

upstream mindverse_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name mindverse.example.com;

    # Redirect all HTTP traffic to HTTPS in production
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mindverse.example.com;

    # SSL Configuration (Let's Encrypt / Certbot paths)
    # ssl_certificate /etc/letsencrypt/live/mindverse.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mindverse.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Static Frontend
    root /var/www/mindverse/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Reverse Proxy /api/ to Gunicorn Flask Backend
    location /api/ {
        proxy_pass http://mindverse_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for learning activity requests
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
