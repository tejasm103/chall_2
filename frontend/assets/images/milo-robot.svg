<svg id="miloSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Milo the Digital Teaching Companion">
  <defs>
    <linearGradient id="miloBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EA8DE" />
      <stop offset="100%" stop-color="#2A9D8F" />
    </linearGradient>
    <linearGradient id="miloEarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D97B5" />
      <stop offset="100%" stop-color="#6C757D" />
    </linearGradient>
    <filter id="miloGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="miloCharacter" class="milo-idle">
    <!-- Left Ear / Speaker -->
    <rect x="22" y="65" width="10" height="20" rx="4" fill="url(#miloEarGrad)" />
    <!-- Right Ear / Speaker -->
    <rect x="128" y="65" width="10" height="20" rx="4" fill="url(#miloEarGrad)" />

    <!-- Antenna -->
    <line id="miloAntennaStem" x1="80" y1="42" x2="80" y2="20" stroke="#3A86C8" stroke-width="4" stroke-linecap="round" />
    <circle id="miloAntennaBulb" cx="80" cy="18" r="8" fill="#FFD166" />

    <!-- Robot Head -->
    <rect id="miloHead" x="28" y="42" width="104" height="76" rx="22" fill="url(#miloBodyGrad)" stroke="#2274A5" stroke-width="3" />
    
    <!-- Face Screen -->
    <rect id="miloScreen" x="40" y="54" width="80" height="52" rx="14" fill="#0F172A" />
    
    <!-- Eyes -->
    <g id="miloEyes">
      <!-- Left Eye -->
      <circle id="miloEyeLeft" cx="60" cy="74" r="9" fill="#48CAE4" />
      <circle cx="63" cy="71" r="3" fill="#FFFFFF" />
      <!-- Right Eye -->
      <circle id="miloEyeRight" cx="100" cy="74" r="9" fill="#48CAE4" />
      <circle cx="103" cy="71" r="3" fill="#FFFFFF" />
    </g>

    <!-- Mouth Variations -->
    <g id="miloMouthGroup">
      <!-- Normal / Friendly Smile (Default) -->
      <path id="miloMouthSmile" d="M 68 88 Q 80 98 92 88" stroke="#48CAE4" stroke-width="3" stroke-linecap="round" fill="none" />
      <!-- Speaking Open Mouth -->
      <ellipse id="miloMouthSpeaking" cx="80" cy="90" rx="9" ry="6" fill="#48CAE4" style="display: none;" />
      <!-- Happy / Celebrating Mouth -->
      <path id="miloMouthCelebrating" d="M 66 86 Q 80 102 94 86 Z" fill="#FFD166" style="display: none;" />
    </g>

    <!-- Neck Connector -->
    <rect x="70" y="118" width="20" height="10" rx="3" fill="#CBD5E1" />

    <!-- Robot Torso / Body -->
    <rect id="miloTorso" x="38" y="128" width="84" height="60" rx="18" fill="url(#miloBodyGrad)" stroke="#2274A5" stroke-width="3" />
    
    <!-- Chest Indicator / Learning Star -->
    <circle cx="80" cy="154" r="14" fill="#FFFFFF" opacity="0.9" />
    <path id="miloChestStar" d="M 80 144 L 83 151 L 90 152 L 85 157 L 86 164 L 80 161 L 74 164 L 75 157 L 70 152 L 77 151 Z" fill="#FFD166" />

    <!-- Left Arm -->
    <g id="miloLeftArm">
      <path d="M 38 140 Q 20 155 26 170" stroke="url(#miloBodyGrad)" stroke-width="10" stroke-linecap="round" fill="none" />
      <circle cx="26" cy="170" r="7" fill="#E2E8F0" />
    </g>

    <!-- Right Arm (Can wave when celebrating) -->
    <g id="miloRightArm">
      <path id="miloRightArmPath" d="M 122 140 Q 140 155 134 170" stroke="url(#miloBodyGrad)" stroke-width="10" stroke-linecap="round" fill="none" />
      <circle id="miloRightHand" cx="134" cy="170" r="7" fill="#E2E8F0" />
    </g>

    <!-- Base Wheels / Treads (Smooth gliding base) -->
    <ellipse cx="80" cy="192" rx="36" ry="6" fill="#64748B" />
  </g>
</svg>
