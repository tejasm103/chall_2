<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" role="img" aria-label="MindVerse Logo">
  <defs>
    <linearGradient id="mvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A86C8" />
      <stop offset="100%" stop-color="#2A9D8F" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#F4A261" />
    </linearGradient>
  </defs>

  <!-- Robot Icon / Mascot Head Motif -->
  <g transform="translate(6, 6)">
    <!-- Antenna -->
    <line x1="24" y1="10" x2="24" y2="4" stroke="#3A86C8" stroke-width="3" stroke-linecap="round" />
    <circle cx="24" cy="4" r="3.5" fill="#FFD166" />

    <!-- Robot Head / Body -->
    <rect x="6" y="10" width="36" height="32" rx="10" fill="url(#mvGrad)" />
    
    <!-- Face Screen -->
    <rect x="11" y="15" width="26" height="18" rx="6" fill="#1E293B" />
    
    <!-- Friendly Eyes -->
    <circle cx="18" cy="23" r="3" fill="#64DFDF" />
    <circle cx="30" cy="23" r="3" fill="#64DFDF" />
    
    <!-- Gentle Smile -->
    <path d="M 20 28 Q 24 31 28 28" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Open Book / Learning Motif at base -->
    <path d="M 10 44 Q 24 40 38 44 Q 24 47 10 44 Z" fill="#E2E8F0" />
    <path d="M 24 41 L 24 46" stroke="#94A3B8" stroke-width="1.5" />
    
    <!-- Learning Star -->
    <path d="M 40 8 L 41.5 11.5 L 45 12 L 42.5 14.5 L 43 18 L 40 16.5 L 37 18 L 37.5 14.5 L 35 12 L 38.5 11.5 Z" fill="url(#starGrad)" />
  </g>

  <!-- Brand Typography -->
  <text x="60" y="34" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="24" font-weight="800" fill="#1E293B" letter-spacing="-0.5">Mind<tspan fill="#2A9D8F">Verse</tspan></text>
  <text x="61" y="48" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1.2">INCLUSIVE LEARNING LAB</text>
</svg>
